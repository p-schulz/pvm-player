# PVM Player -- ARD teletext: browse currently-available ARD Mediathek
# videos and play them directly, built from the MediathekViewWeb API
# (https://mediathekviewweb.de -- a community-run, publicly documented
# aggregator across German public broadcasters; not ARD's own private API).
# See zdf.cfg for the same idea scoped to ZDF instead.
#
# The app reads ard.cfg next to the executable if there is one, otherwise the
# copy of this file the build places there as ard.default.cfg. To change it,
# copy ard.default.cfg to ard.cfg and edit that.
#
# Layout: page 100 lists your FAVORITES (below) for quick selection, plus a
# link into a generated "ALL SHOWS (A-Z)" index of everything uploaded in the
# last az_window_days. Each show -- favorite or generated -- gets exactly ONE
# page number: a title-art index, then its episodes (newest/lowest-numbered
# first when season/episode numbers are known, extras newest-first
# otherwise), spread across that page's own SUB-PAGES if there are more than
# fit on one screen -- an authentic teletext concept (several screens under
# one page number, "turned" with Left/Right) that means a show never eats
# into another show's page numbers no matter how many episodes it has. Up/
# Down selects a row, Enter opens a show or plays an episode directly; Left/
# Right turn the sub-page, then the page. A show's list is a snapshot of
# what is available right now, not a stable catalog -- ARD Mediathek
# retention varies per show, so a page that's full today may be empty in a
# few weeks.
#
# The generated A-Z index is always built from `channel` below only, at most
# every refresh_minutes (never less than 5), one request at a time. Favorites
# below can each target a different channel (see CHANNEL).

channel=ARD
service_name=ARD Mediathek
service_logo=ARD MEDIATHEK

refresh_minutes=60
max_episode_pages=30
az_start_page=200
az_window_days=14
az_query_size=1500
az_max_shows=200

# favorite = <page> | <MediathekViewWeb topic> [| <LABEL> [| <CHANNEL>]]
#   topic     matched against MediathekViewWeb's `topic` field -- usually the
#             show's exact name; check with:
#               ./build/teletext_probe --ard "<name>" --limit 3
#             before adding it (spelling has to match exactly).
#   LABEL     the title-art/header text, up to 13 characters (defaults to
#             `topic`, folded to ASCII and upper-cased)
#   CHANNEL   which broadcaster to search (default: this file's own
#             `channel` above). Many "ARD"-branded shows are actually
#             produced by, and tagged under, one specific regional
#             broadcaster instead (WDR, SWR, BR, rbb, ...) -- if a favorite
#             turns up almost empty, run
#               ./build/teletext_probe --ard "<name>" --all-channels
#             to see which channel its real episodes carry, and set it
#             here. The generated A-Z index doesn't take this override --
#             it always stays scoped to `channel` above, so it stays one
#             manageable feed rather than pulling in every regional
#             broadcaster's catalog.
#
# Each favorite needs only the one page number below -- however many
# episodes a show has, they live on that page's own sub-pages, not on
# further page numbers, so favorites can be packed as tightly as you like.
favorite=110 | Tagesschau         | TAGESSCHAU
favorite=120 | Babylon Berlin     | BABYLON BERLIN
favorite=130 | Mord mit Aussicht  | MORD/AUSSICHT | WDR
favorite=140 | Tatort             | TATORT
