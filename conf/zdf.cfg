# PVM Player -- ZDF teletext: browse currently-available ZDF Mediathek
# videos and play them directly, built from the MediathekViewWeb API
# (https://mediathekviewweb.de -- a community-run, publicly documented
# aggregator across German public broadcasters; not ZDF's own private API).
# Same idea and page layout as ard.cfg (see its header comment for the
# details of sub-pages, the A-Z index, and Up/Down/Left/Right/Enter), just
# scoped to channel=ZDF instead of ARD.
#
# The app reads zdf.cfg next to the executable if there is one, otherwise the
# copy of this file the build places there as zdf.default.cfg. To change it,
# copy zdf.default.cfg to zdf.cfg and edit that.

channel=ZDF
service_name=ZDF Mediathek
service_logo=ZDF MEDIATHEK

refresh_minutes=60
max_episode_pages=30
az_start_page=200
az_window_days=14
az_query_size=1500
az_max_shows=200

# favorite = <page> | <MediathekViewWeb topic> [| <LABEL> [| <CHANNEL>]]
# See ard.cfg's own comment for the full field explanation; CHANNEL here
# defaults to ZDF instead of ARD. Check a candidate topic first with:
#   ./build/teletext_probe --ard "<name>" --channel ZDF --limit 3
favorite=110 | heute-show | HEUTE-SHOW
