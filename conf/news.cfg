# PVM Player -- NEWS section (teletext) sources.
#
# The app reads news.cfg next to the executable if there is one, otherwise the
# copy of this file that the build places there as news.default.cfg. To change
# sources, copy news.default.cfg to news.cfg and edit that.
#
# Each source owns a block of pages starting at its start page: the first page
# is the headline list, the rest hold articles (newest first; the oldest fall
# off when the block is full). Page 100 is the index. Use start pages
# 101-899 at least block_size apart.
#
# Be polite: these are personal-use feeds, refreshed no more often than every
# 5 minutes (values below that are raised to 5).

refresh_minutes=15
block_size=10
max_article_pages=3

# The blue "Weather" key on the bottom bar jumps to this page. Point it at
# the start page of one of the sources below (or remove the line to disable).
weather_page=150

# source = <start page> | <CATEGORY> | <RSS or Atom URL> [| <provider> [| <LOGO>]]
#   provider  shown in cyan in the header of every page of the source
#             (defaults to the URL's host name)
#   LOGO      big title-art text on the source's index page, max 13
#             characters, letters/digits and . - + & ! only
source=110 | WORLD   | https://feeds.bbci.co.uk/news/world/rss.xml    | bbc.co.uk       | BBC NEWS
source=120 | US NEWS | https://feeds.npr.org/1001/rss.xml             | npr.org         | NPR NEWS
source=130 | TECH    | https://feeds.arstechnica.com/arstechnica/index | arstechnica.com | ARS TECHNICA
source=140 | DEUTSCH | https://www.tagesschau.de/xml/rss2/            | tagesschau.de   | TAGESSCHAU
source=150 | WEATHER | https://www.wetter.com/wetter_rss/wetter.xml   | wetter.com      | WETTER.COM
