# Key binding overrides. Copy to keys.cfg next to the executable and edit.
# Each line replaces all default keys of one action:
#
#     <action> = KEY[, KEY...]
#
# An empty right-hand side unbinds the action. Lines not listed keep their
# defaults. Key names: A-Z, 0-9, KP_0-KP_9, F1-F25, UP, DOWN, LEFT, RIGHT,
# ENTER, KP_ENTER, ESCAPE, BACKSPACE, SPACE, TAB, COMMA, PERIOD, MINUS,
# EQUAL, KP_ADD, KP_SUBTRACT, PAGE_UP, PAGE_DOWN, HOME, END, INSERT, DELETE,
# and SCANCODE_<hex> for keys GLFW has no name for.
#
# Defaults:
#
# up             = UP
# down           = DOWN
# left           = LEFT
# right          = RIGHT
# confirm        = ENTER, KP_ENTER
# back           = ESCAPE              (stop playback, leave screen, quit at root)
# back_soft      = BACKSPACE           (leave screen, never stops or quits)
# play_pause     = SPACE, F
# seek_back      =                     (Left/Right also seek while playing)
# seek_fwd       =
# volume_down    = COMMA
# volume_up      = PERIOD
# toggle_osd     = M, I
# media_info     = R
# video_scale    = V
# aspect_ratio   = B
# toggle_crt     = C
# fastext_red    = F1, R
# fastext_green  = F2, G
# fastext_yellow = F3, Y, M
# fastext_blue   = F4, B
# digit_0 ... digit_9 = 0-9, KP_0-KP_9
#
# Example: page through teletext with Page Up/Down as well
# fastext_red   = F1, R, PAGE_UP
# fastext_green = F2, G, PAGE_DOWN

# ---------------------------------------------------------------------------
# Android (handheld / gamepad)
#
# The Android build reads keys.cfg from the app's files directory, with the
# same syntax, and these additional names:
#
#   PAD_A PAD_B PAD_X PAD_Y PAD_L1 PAD_R1 PAD_L2 PAD_R2 PAD_START PAD_SELECT
#   PAD_MODE PAD_THUMBL PAD_THUMBR        gamepad buttons (BUTTON_A ... also work)
#   DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT DPAD_CENTER   the D-pad as keys
#   HAT_UP HAT_DOWN HAT_LEFT HAT_RIGHT    the D-pad as an axis (some devices)
#   LSTICK_UP LSTICK_DOWN LSTICK_LEFT LSTICK_RIGHT   the left stick
#   BACK MEDIA_PLAY_PAUSE MEDIA_NEXT MEDIA_PREVIOUS ...
#   HOLD_<name>                           a long press (0.5 s) of that button
#
# Extra actions the gamepad uses (unbound on desktop):
#   page_up / page_down   list paging          open_settings   menus: settings
#   next_section          cycle NEWS/TAGESSCHAU/ARD/ZDF
#   page_entry            teletext page-number spinner
#   scroll_up / scroll_down                    analog only, not rebindable
#
# Android defaults:
#
# up / down / left / right = DPAD_*, HAT_*, LSTICK_*
# confirm        = PAD_A, DPAD_CENTER, ENTER
# play_pause     = PAD_A, MEDIA_PLAY_PAUSE, SPACE
# back           = PAD_B, BACK, ESCAPE
# toggle_crt     = PAD_X, C
# media_info     = PAD_Y, R
# fastext_yellow = PAD_Y, Y
# page_entry     = HOLD_PAD_Y
# page_up        = PAD_L1          page_down = PAD_R1
# seek_back      = PAD_L1          seek_fwd  = PAD_R1
# fastext_red    = PAD_L1          fastext_green = PAD_R1
# open_settings  = PAD_START       toggle_osd = PAD_START    fastext_blue = PAD_START
# next_section   = PAD_SELECT      aspect_ratio = PAD_SELECT
# video_scale    = PAD_THUMBR      (R3: pillarbox / stretch / full width)
#
# L2 / R2 (seek, speed proportional to how far they are pulled) and the right
# stick (volume while playing, scrolling on teletext) are analog and fixed.
# The volume keys are left to Android.
#
# Android names buttons by their position in the Xbox layout. On a device with
# Nintendo-style labels, swap A and B like this:
# confirm = PAD_B, DPAD_CENTER, ENTER
# back    = PAD_A, BACK, ESCAPE
