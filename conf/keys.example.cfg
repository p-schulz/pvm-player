# Key binding overrides. Copy to keys.cfg next to the executable and edit.
# Each line replaces all default keys of one action:
#
#     <action> = KEY[, KEY...]
#
# An empty right-hand side unbinds the action. Lines not listed keep their
# defaults. Key names: A-Z, 0-9, KP_0-KP_9, F1-F25, UP, DOWN, LEFT, RIGHT,
# ENTER, KP_ENTER, ESCAPE, BACKSPACE, SPACE, TAB, COMMA, PERIOD, MINUS,
# EQUAL, KP_ADD, KP_SUBTRACT, PAGE_UP, PAGE_DOWN, HOME, END, INSERT, DELETE,
# and SCANCODE_<hex> for keys GLFW has no name for.
#
# Defaults:
#
# up             = UP
# down           = DOWN
# left           = LEFT
# right          = RIGHT
# confirm        = ENTER, KP_ENTER
# back           = ESCAPE              (stop playback, leave screen, quit at root)
# back_soft      = BACKSPACE           (leave screen, never stops or quits)
# play_pause     = SPACE, F
# seek_back      =                     (Left/Right also seek while playing)
# seek_fwd       =
# volume_down    = COMMA
# volume_up      = PERIOD
# toggle_osd     = M, I
# media_info     = R
# video_scale    = V
# aspect_ratio   = B
# toggle_crt     = C
# fastext_red    = F1, R
# fastext_green  = F2, G
# fastext_yellow = F3, Y, M
# fastext_blue   = F4, B
# digit_0 ... digit_9 = 0-9, KP_0-KP_9
#
# Example: page through teletext with Page Up/Down as well
# fastext_red   = F1, R, PAGE_UP
# fastext_green = F2, G, PAGE_DOWN
