# PVM Player -- TAGESSCHAU teletext: a separate, larger teletext service built
# from the tagesschau.de RSS feeds, opened from the root menu's TAGESSCHAU entry.
#
# The app reads tagesschau.cfg next to the executable if there is one, otherwise
# the copy of this file the build places there as tagesschau.default.cfg. To
# change it, copy tagesschau.default.cfg to tagesschau.cfg and edit that.
#
# Layout: every hundred page (100, 200, ... 900) is a small overview listing the
# newest articles found in its 100-page range with their page numbers, plus
# the sections there. Each source below owns the pages of its range: its first
# page is the section index (title art + headlines), then come the articles,
# newest first; the oldest fall off when the range is full. Article pages
# skip the hundred pages, so a range such as 510-699 simply passes over 600.
#
# Only these feeds are fetched, one at a time, at most every refresh_minutes
# (never less than 5).

overview_pages=hundreds
service_name=tagesschau.de
service_logo=TAGESSCHAU
refresh_minutes=15
max_article_pages=3

# source = <first>-<last page> | <CATEGORY> | <feed URL> | <provider> | <LOGO>

# 100-199: latest reports
source=110-149 | MELDUNGEN      | https://www.tagesschau.de/infoservices/alle-meldungen-100~rss2.xml | tagesschau.de | MELDUNGEN
source=150-199 | STARTSEITE     | https://www.tagesschau.de/index~rss2.xml                          | tagesschau.de | STARTSEITE

# 200-399: Germany
source=210-259 | INLAND         | https://www.tagesschau.de/inland/index~rss2.xml                   | tagesschau.de | INLAND
source=260-299 | INNENPOLITIK   | https://www.tagesschau.de/inland/innenpolitik/index~rss2.xml      | tagesschau.de | INNENPOLITIK
source=310-349 | GESELLSCHAFT   | https://www.tagesschau.de/inland/gesellschaft/index~rss2.xml      | tagesschau.de | GESELLSCHAFT
source=350-399 | REGIONAL       | https://www.tagesschau.de/inland/regional/index~rss2.xml          | tagesschau.de | REGIONAL

# 400-499: Baden-Wuerttemberg
source=410-499 | BADEN-WUERTT.  | https://www.tagesschau.de/inland/regional/badenwuerttemberg/index~rss2.xml | tagesschau.de | BADEN-WUERTT.

# 500-699: world
source=510-699 | AUSLAND        | https://www.tagesschau.de/ausland/index~rss2.xml                  | tagesschau.de | AUSLAND

# 700-799: economy
source=710-799 | WIRTSCHAFT     | https://www.tagesschau.de/wirtschaft/index~rss2.xml               | tagesschau.de | WIRTSCHAFT

# 800-999: science
source=810-859 | WISSEN         | https://www.tagesschau.de/wissen/index~rss2.xml                   | tagesschau.de | WISSEN
source=860-899 | GESUNDHEIT     | https://www.tagesschau.de/wissen/gesundheit/index~rss2.xml        | tagesschau.de | GESUNDHEIT
source=910-939 | KLIMA & UMWELT | https://www.tagesschau.de/wissen/klima/index~rss2.xml             | tagesschau.de | KLIMA&UMWELT
source=940-969 | FORSCHUNG      | https://www.tagesschau.de/wissen/forschung/index~rss2.xml         | tagesschau.de | FORSCHUNG
source=970-999 | TECHNOLOGIE    | https://www.tagesschau.de/wissen/technologie/index~rss2.xml       | tagesschau.de | TECHNOLOGIE
